sonar.projectKey=Cooooooler_lucy
sonar.organization=cooooooler
sonar.projectName=lucy

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=apps/backend/src,apps/frontend/src,packages

# 完全排除（生成代码/第三方产物，不做任何分析）
sonar.exclusions=**/node_modules/**,**/dist/**,apps/frontend/src/routeTree.gen.ts,packages/shared/src/generated/**,apps/frontend/src/components/**,apps/frontend/src/assets/**,**/*.d.ts

# 复制粘贴检测（CPD）的排除项：**只**影响重复率这一个指标——代码规范、漏洞/安全热点、
# 覆盖率都照常统计（覆盖率排除另有 sonar.coverage.exclusions）。
# - migrations：DDL 由 migration:generate 生成，各文件天然共享 import/class/up/down 骨架
# - 测试文件：夹具、mock/桩与断言模板天然成片重复，给它设重复率门槛只会逼出为过门禁而写的抽象
# - 后端 DTO：允许式白名单的写法要求字段类型在契约里**平铺**声明，列表项/详情这类
#   「子集 + 少量字段」的契约必然成块重复；改成 allOf 继承虽能消重复，却会改变 Swagger
#   输出形状（平铺 properties → allOf，前端生成类型与钉住契约的用例都要跟着动），代价更大
sonar.cpd.exclusions=\
  apps/backend/src/db/migrations/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/backend/src/**/dto/**

# 仅从覆盖率统计中剔除，仍参与代码规范与漏洞扫描
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.module.ts,\
  **/*.decorator.ts,\
  apps/backend/src/db/migrations/**,\
  apps/backend/src/db/data-source.ts,\
  apps/backend/src/main.ts,\
  apps/backend/src/**/dto/**,\
  apps/backend/src/test/**,\
  apps/frontend/src/main.tsx,\
  apps/frontend/src/router.ts,\
  apps/frontend/src/routeTree.gen.ts,\
  apps/frontend/src/routes/**,\
  apps/frontend/src/backgrounds/**,\
  apps/frontend/src/test/**,\
  apps/frontend/src/**/*.test.ts,\
  apps/frontend/src/**/*.test.tsx

# Backend + Frontend + Redis + Shared package Vitest coverage (lcov reports)
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info,packages/redis/coverage/lcov.info,packages/shared/coverage/lcov.info
