sonar.projectKey=Cooooooler_lucy
sonar.organization=cooooooler
sonar.projectName=lucy

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=apps/backend/src,apps/frontend/src,apps/desktop/src,packages

# 完全排除（生成代码/第三方产物，不做任何分析）
# components 只排除真正来自 shadcn/基础视觉层的 ui、bits；知识库/模型供应商等业务组件
# 必须参与 Sonar 的缺陷、重复率与覆盖率统计，否则它们的测试写得再多也不进质量门禁。
sonar.exclusions=**/node_modules/**,**/dist/**,apps/frontend/src/routeTree.gen.ts,packages/shared/src/generated/**,apps/frontend/src/components/ui/**,apps/frontend/src/components/bits/**,apps/frontend/src/assets/**,packages/*/test/**,**/*.d.ts

# 复制粘贴检测（CPD）的排除项：**只**影响重复率这一个指标——代码规范、漏洞/安全热点、
# 覆盖率都照常统计（覆盖率排除另有 sonar.coverage.exclusions）。
# - migrations：DDL 由 migration:generate 生成，各文件天然共享 import/class/up/down 骨架
# - 测试文件：夹具、mock/桩与断言模板天然成片重复，给它设重复率门槛只会逼出为过门禁而写的抽象
# - 后端 DTO：允许式白名单的写法要求字段类型在契约里**平铺**声明，列表项/详情这类
#   「子集 + 少量字段」的契约必然成块重复；改成 allOf 继承虽能消重复，却会改变 Swagger
#   输出形状（平铺 properties → allOf，前端生成类型与钉住契约的用例都要跟着动），代价更大
sonar.cpd.exclusions=\
  apps/backend/src/db/migrations/**,\
  **/*.spec.ts,\
  **/*.test.ts,\
  **/*.test.tsx,\
  apps/backend/src/**/dto/**

# 仅从覆盖率统计中剔除，仍参与代码规范与漏洞扫描
# - 测试文件用通用 glob：包内的 src/**/*.test.ts(x) 不在 lcov 上报里，
#   若当作源码统计会让新代码覆盖率按 0 计（react-view-state 曾因此掉到 63%）
# - 纯转发的后端控制器：行为由 e2e 覆盖；vitest 已将这四个文件排除，
#   此处同步排除以免 Sonar 把它们当作未被覆盖的新代码。
#   ai / health / auth 控制器有真实逻辑，仍计入覆盖率。
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.module.ts,\
  **/*.decorator.ts,\
  apps/backend/src/app.controller.ts,\
  apps/backend/src/knowledge/knowledge.controller.ts,\
  apps/backend/src/model-provider/model-provider.controller.ts,\
  apps/backend/src/users/users.controller.ts,\
  apps/backend/src/db/migrations/**,\
  apps/backend/src/db/data-source.ts,\
  apps/backend/src/main.ts,\
  apps/backend/src/**/dto/**,\
  apps/backend/test/**,\
  apps/frontend/src/main.tsx,\
  apps/frontend/src/router.ts,\
  apps/frontend/src/routeTree.gen.ts,\
  apps/frontend/src/routes/__root.tsx,\
  apps/frontend/src/routes/_auth.tsx,\
  apps/frontend/src/routes/_layout.tsx,\
  apps/frontend/src/routes/_layout/chat.tsx,\
  apps/frontend/src/routes/_layout/knowledge.tsx,\
  apps/frontend/src/backgrounds/**,\
  apps/frontend/test/**,\
  apps/desktop/**,\
  apps/desktop/test/**,\
  packages/*/test/**,\
  **/*.test.ts,\
  **/*.test.tsx,\
  packages/react-view-state/src/index.ts,\
  packages/react-view-state/src/test-setup.ts,\
  packages/*/vitest.config.ts,\
  packages/*/eslint.config.*,\
  packages/*/docs/**

# Backend + Frontend + Redis + Shared + File-nest + React-view-state package Vitest coverage (lcov reports)
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info,packages/redis/coverage/lcov.info,packages/shared/coverage/lcov.info,packages/file-nest/coverage/lcov.info,packages/react-view-state/coverage/lcov.info
