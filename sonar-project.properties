sonar.projectKey=Cooooooler_lucy
sonar.organization=cooooooler
sonar.projectName=lucy

# Encoding of the source code
sonar.sourceEncoding=UTF-8

# Paths are relative to this file. Replace "\" by "/" on Windows.
sonar.sources=apps/backend/src,apps/frontend/src,packages

# 完全排除（生成代码/第三方产物，不做任何分析）
sonar.exclusions=**/node_modules/**,**/dist/**,apps/frontend/src/routeTree.gen.ts,packages/shared/src/generated/**,apps/frontend/src/components/**,**/*.d.ts

# 仅从覆盖率统计中剔除，仍参与代码规范与漏洞扫描
sonar.coverage.exclusions=\
  **/*.spec.ts,\
  **/*.module.ts,\
  **/*.decorator.ts,\
  apps/backend/src/db/migrations/**,\
  apps/backend/src/db/data-source.ts,\
  apps/backend/src/main.ts,\
  apps/backend/src/**/dto/**,\
  apps/frontend/src/main.tsx,\
  apps/frontend/src/router.ts,\
  apps/frontend/src/routeTree.gen.ts,\
  apps/frontend/src/routes/**,\
  apps/frontend/src/backgrounds/**,\
  apps/frontend/src/test/**,\
  apps/frontend/src/**/*.test.ts,\
  apps/frontend/src/**/*.test.tsx

# Backend + Frontend Vitest coverage (lcov reports)
sonar.javascript.lcov.reportPaths=apps/backend/coverage/lcov.info,apps/frontend/coverage/lcov.info
