services:
  redis:
    image: redis/redis-stack-server:latest
    container_name: lucy-redis
    restart: unless-stopped
    ports:
      - '127.0.0.1:6379:6379'
    volumes:
      - redis-data:/data
    command:
      - redis-server
      - --appendonly
      - yes
      - --loadmodule
      - /opt/redis-stack/lib/redisbloom.so
      - --protected-mode
      - no
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  redis-data:
