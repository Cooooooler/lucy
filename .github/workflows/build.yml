name: Build

on:
  push:
    branches:
      - master
  pull_request:
    types: [opened, synchronize, reopened]

# 同一 ref 同时只保留一个 run：PR 反复 push(synchronize) 时取消旧 run，避免排队任务堆积
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 最小权限：仅读仓库内容；上传 artifact/Sonar 等如需额外写权限再单独补
permissions:
  contents: read

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @lucy/shared build
      - name: Build redis package
        run: pnpm --filter @coool/redis-nest build
      - name: Build file-nest package
        run: pnpm --filter @coool/file-nest build
      - name: Lint
        run: pnpm lint
      - name: Typecheck
        run: pnpm typecheck

  backend-tests:
    name: Backend tests with coverage
    runs-on: tenki-standard-small-2c-4g
    services:
      redis:
        image: redis/redis-stack-server:7.2.0-v16
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Shallow clones should be disabled for a better relevancy of analysis
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @lucy/shared build
      - name: Build redis package
        run: pnpm --filter @coool/redis-nest build
      - name: Build file-nest package
        run: pnpm --filter @coool/file-nest build
      - name: Backend tests with coverage
        run: pnpm --filter @lucy/backend test:cov
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage
          if-no-files-found: error
          retention-days: 1

  frontend-tests:
    name: Frontend tests with coverage
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build shared package
        run: pnpm --filter @lucy/shared build
      - name: Frontend tests with coverage
        run: pnpm --filter @lucy/frontend test:cov
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage
          if-no-files-found: error
          retention-days: 1

  redis-tests:
    name: Redis package tests with coverage
    runs-on: tenki-standard-small-2c-4g
    services:
      redis:
        image: redis/redis-stack-server:7.2.0-v16
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v6
        with:
          version: 10.33.2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Redis package tests with coverage
        run: pnpm --filter @coool/redis-nest test:cov
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: redis-coverage
          path: packages/redis/coverage
          if-no-files-found: error
          retention-days: 1

  sonarqube:
    name: SonarCloud Scan
    needs: [backend-tests, frontend-tests, redis-tests]
    runs-on: tenki-standard-small-2c-4g
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # 全量历史，SonarCloud 分析相关性需要
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: backend-coverage
          path: apps/backend/coverage
      - name: Download frontend coverage report
        uses: actions/download-artifact@v4
        with:
          name: frontend-coverage
          path: apps/frontend/coverage
      - name: Download redis coverage report
        uses: actions/download-artifact@v4
        with:
          name: redis-coverage
          path: packages/redis/coverage
      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
