name: PR Skill Review

# 与 PR-Agent 互补的技能评审作业。
#
# PR-Agent 在 .pr_agent.toml 里做全仓库通用评审（它原生支持 skills，但技能是在
# 拼 prompt 时「静态内联」的：单次模型调用没有文件读取工具，做不到按需加载，
# 见其 agent_skills 文档 "progressive disclosure ... is not implementable on the
# current architecture"）。本作业改用带工具循环的 Command Code CLI，真正按需加载：
#   apps/frontend/** -> vercel-react-best-practices
#   apps/backend/**  -> nestjs-best-practices
# 模型先只看到技能的 name + description，判断相关后才读 SKILL.md，再按需读
# rules/*.md —— 和本地 CLI 里手动调用技能的行为一致。
#
# 触发策略：**只在手动评论时评审**（PR 上评论 `/skill-review`）。
#
# 原先同时订阅 `pull_request`（opened/ready_for_review/reopened）自动跑一轮，实测 #80
# 撞上竞态导致零产出：
#   14:17:26  pull_request run 启动，评审要跑 4~5 分钟
#   14:21:00  SonarCloud 机器人在 PR 上发质量门禁评论 → 触发 issue_comment 事件
#             → 落进同一个 concurrency group → 新 run 排队并把正在跑的评审取消
#   结果：评审跑满 4 分多钟后被机器人评论打断，PR 上没有任何评审产出。
#
# 为什么当时没改 `if` 而是删掉自动触发：`if` 拦不住。job 级 `if` 在**排队之后**才求值，
# 而 concurrency 取消发生在排队那一刻——机器人那条 run 先取消了在跑的评审，
# 然后才被 `if` 判成 `skipped`（#80 的 run 36875641369 就是 skipped）。
# 「跳过」不等于「不参与竞争」。
#
# 为什么这个时间窗是稳定复现的：Sonar 的评论稳定在 PR 创建后 3~4 分钟到达，
# 而一轮评审要 4~5 分钟，两者高度重叠——等于每个改动 apps/** 的 PR 都会撞上。
# #79 侥幸躲过（评审先跑完），#80 没躲过。竞态问题平时不会暴露，但代价是整轮评审白跑。
#
# 现在只保留手动入口：一次修复对应一次评审，触发时机由人决定（跑完 CI、看完 diff 再评），
# 也不再消耗自动触发的额度。`cancel-in-progress: true` 保留——同一 PR 连续评论两次
# `/skill-review` 时后一次顶掉前一次，符合预期（两次针对同一 head 时结果相同，只留一轮）。
# 并发组按「是否是 /skill-review」分桶（见下方 concurrency），机器人评论不再取消在跑评审。

# 鉴权：官方 headless 登录是 OAuth（不适合 CI）。这里用仓库 owner 的 Command Code
# 账号 API key（COMMAND_CODE_API_KEY，headless 下 CLI 据此登录），模型调用走该账号
# 额度、经 Command Code 网关，不再走 BYOK：网关模型由 CLI 自带目录解析窗口与输出
# 上限，不需要在 providers.json 里手工声明。

on:
  # 重要：GitHub 只在「默认分支」存在该工作流时才响应 issue_comment 事件，
  # 因此这个入口要在本文件合并进 master 后才生效（与 pr-agent.yml 同理）。
  issue_comment:
    types: [created]

# 同一 PR 的 /skill-review 评审串行执行，反复触发时只保留最新一轮。
# 并发组按「是否 /skill-review」分桶：只有该评论进 -review 组；Sonar 等机器人的
# 评论进 -skip 组，其 run 会被 job 级 if 判成 skipped，但不会再取消 -review 组里
# 正在跑的评审。仅按 PR 编号分组时，机器人评论会进同一组、把在跑的评审 cancel 掉
# （#104/#105 实测）；job 级 if 拦不住——排队先发生、if 后求值。
concurrency:
  group: pr-skill-review-${{ github.event.issue.number }}-${{ startsWith(github.event.comment.body, '/skill-review') && 'review' || 'skip' }}
  cancel-in-progress: true

# 读代码 + 发评论 + 写 commit status；本作业不会回推代码
permissions:
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  skill-review:
    name: Skill-based review
    # 只保留手动入口后，触发条件收敛成一件事：PR 上以 `/skill-review` 开头的评论，
    # 且发起者非 bot、有写权限——否则外部贡献者也能用一句评论消耗仓库 owner 的账号额度。
    # （原先的 `pull_request` 分支同仓库/非 draft 判定已随自动触发一起移除；
    # fork PR 的 secrets 限制由下方 author_association 白名单一并挡住：
    # fork 贡献者身份是 CONTRIBUTOR，不在名单内。）
    if: >-
      github.event_name == 'issue_comment' && github.event.issue.pull_request && github.event.sender.type != 'Bot' && startsWith(github.event.comment.body, '/skill-review') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: tenki-standard-small-2c-4g
    timeout-minutes: 30
    env:
      # Command Code CLI 自身的鉴权。headless 下 CLI 必须先登录（实测：缺失时报
      # "Not authenticated"）。模型调用走本账号额度、经 Command Code 网关。
      # 在 Studio 生成 API key：https://commandcode.ai/studio
      COMMAND_CODE_API_KEY: ${{ secrets.COMMAND_CODE_API_KEY }}
      # 账号网关内的一等模型 id（网关目录自带，如 `cmd --list-models` 所示，
      # 简写 deepseek-v4.1-flash 也可；不再走 BYOK providers.json）。
      # 固定为 DeepSeek V4.1 Flash。
      SKILL_REVIEW_MODEL: deepseek/deepseek-v4.1-flash
    steps:
      - name: Resolve review target
        # issue_comment 的载荷里只有 issue.number，没有 base/head；统一在这里解析成后续
        # 步骤共用的 outputs，让自动与手动两条触发路径走同一条下游流程。
        # 用 actions/github-script（Node 动作）而非 shell 里的 gh/jq：不依赖自托管 runner
        # 是否装了这些命令行工具。
        id: target
        uses: actions/github-script@v9
        with:
          script: |
            const { owner, repo } = context.repo;
            const number =
              context.payload.pull_request?.number ?? context.payload.issue.number;
            const { data: pr } = await github.rest.pulls.get({
              owner,
              repo,
              pull_number: number,
            });
            core.setOutput('number', String(number));
            core.setOutput('base_ref', pr.base.ref);
            core.setOutput('head_sha', pr.head.sha);

      - uses: actions/checkout@v7
        with:
          # 显式检出 PR head：issue_comment 事件默认检出默认分支，不指定就会评错代码
          ref: ${{ steps.target.outputs.head_sha }}
          fetch-depth: 0

      - name: Prepare path-scoped diffs
        id: diff
        # 生成按目录切分的补丁，让每次评审只看到自己那半边的改动。
        # 放在安装 CLI 之前：docs/CI-only PR 两侧补丁都为空，可以直接走 N/A 快路径，
        # 不必白装一次 CLI。
        run: |
          set -euo pipefail
          BASE="origin/${{ steps.target.outputs.base_ref }}"
          git fetch --no-tags origin "${{ steps.target.outputs.base_ref }}"
          mkdir -p .pr-skill-review
          # routeTree.gen.ts 是 TanStack Router 生成产物（AGENTS.md 明确禁止手改），排除
          git diff --unified=5 "$BASE"...HEAD -- apps/frontend \
            ':(exclude)apps/frontend/src/routeTree.gen.ts' \
            > .pr-skill-review/frontend.patch
          git diff --unified=5 "$BASE"...HEAD -- apps/backend \
            > .pr-skill-review/backend.patch
          FE=$(wc -c < .pr-skill-review/frontend.patch | tr -d ' ')
          BE=$(wc -c < .pr-skill-review/backend.patch | tr -d ' ')
          echo "fe_bytes=$FE" >> "$GITHUB_OUTPUT"
          echo "be_bytes=$BE" >> "$GITHUB_OUTPUT"
          echo "frontend patch: ${FE} bytes, backend patch: ${BE} bytes"

      - name: Mark review status (pending / N/A)
        id: status-start
        # 把「评审是否跑过」变成 head SHA 上的 commit status，供 ruleset 作为必需检查：
        # - 有 apps 补丁 → pending，评审结束后由最后一步改写
        # - 两侧都为空 → success（N/A），并跳过后续 CLI/评审步骤
        # 新 push 会产生新 SHA、没有状态，因此天然要求「对当前 head 重新评审」。
        uses: actions/github-script@v9
        env:
          FE_BYTES: ${{ steps.diff.outputs.fe_bytes }}
          BE_BYTES: ${{ steps.diff.outputs.be_bytes }}
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
        with:
          script: |
            const { owner, repo } = context.repo;
            const isNa = process.env.FE_BYTES === '0' && process.env.BE_BYTES === '0';
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.HEAD_SHA,
              context: 'skill-review',
              state: isNa ? 'success' : 'pending',
              description: isNa ? 'N/A（无 apps 补丁）' : '技能评审进行中',
            });
            core.setOutput('skip', isNa ? 'true' : 'false');

      - uses: actions/setup-node@v7
        if: steps.status-start.outputs.skip != 'true'
        with:
          node-version: 22

      - name: Install Command Code CLI
        if: steps.status-start.outputs.skip != 'true'
        run: npm install -g command-code

      - name: Pin installed CLI version
        if: steps.status-start.outputs.skip != 'true'
        # CI 与网关模型目录保持一致：npm 装最新版 CLI，本步打印确切版本，
        # 失败时排查“模型 id 不存在”先看这里的版本号。
        run: |
          command-code --version

      - name: Preflight - verify model id
        if: steps.status-start.outputs.skip != 'true'
        # 网关账号/模型 id 出问题时，这里能看到 CLI 的报错信息；失败不阻断后续
        continue-on-error: true
        env:
          COMMAND_CODE_API_KEY: ${{ secrets.COMMAND_CODE_API_KEY }}
        run: |
          command-code --list-models | head -c 4000
          echo

      - name: Frontend review (vercel-react-best-practices)
        if: steps.diff.outputs.fe_bytes != '0'
        # 评审失败也应保留已有结果并照常发评论，故不断阻断
        continue-on-error: true
        env:
          REVIEW_SIDE: frontend
          REVIEW_SKILL: vercel-react-best-practices
          REVIEW_ANCHOR: 前端
        run: |
          cat > .pr-skill-review/frontend-prompt.txt <<'PROMPT'
          /skill:vercel-react-best-practices

          你是资深 React 前端工程师。请用上面加载的 vercel-react-best-practices 技能，评审本 PR 中 apps/frontend/** 的改动。

          步骤：
          1. 先读该技能的 SKILL.md，了解规则分类与适用场景。
          2. 读改动补丁 .pr-skill-review/frontend.patch（用 read_file；补丁可能较长，
             若一次读不完整就按返回提示的 offset 分段读完，不要只评一部分）。
          3. 只针对补丁涉及的代码，按需读取技能里相关规则文件（rules/*.md）后再判断；必要时用 read_file/grep/glob 读取仓库相关源码作上下文。
          4. 只报高置信度、真实可改的问题，不要复述补丁，不要泛泛而谈。

          输出要求（简体中文 Markdown）：
          - 每条格式：`文件:行` — 命中规则名（如 async-parallel）— 问题 — 修复建议
          - 按影响从高到低排序，最多 8 条
          - 没有问题就只输出一行：前端未发现需要修改的问题
          - 不要输出思考过程，不要修改任何文件
          PROMPT

          bash .github/skill-review/scripts/review-with-retry.sh

      - name: Backend review (nestjs-best-practices)
        if: steps.diff.outputs.be_bytes != '0'
        continue-on-error: true
        env:
          REVIEW_SIDE: backend
          REVIEW_SKILL: nestjs-best-practices
          REVIEW_ANCHOR: 后端
        run: |
          cat > .pr-skill-review/backend-prompt.txt <<'PROMPT'
          /skill:nestjs-best-practices

          你是资深 NestJS 后端工程师。请用上面加载的 nestjs-best-practices 技能，评审本 PR 中 apps/backend/** 的改动。

          步骤：
          1. 先读该技能的 SKILL.md，了解规则分类与适用场景。
          2. 读改动补丁 .pr-skill-review/backend.patch（用 read_file；补丁可能较长，
             若一次读不完整就按返回提示的 offset 分段读完，不要只评一部分）。
          3. 只针对补丁涉及的代码，按需读取技能里相关规则文件（rules/*.md）后再判断；必要时用 read_file/grep/glob 读取仓库相关源码作上下文。
          4. 只报高置信度、真实可改的问题，不要复述补丁，不要泛泛而谈。

          输出要求（简体中文 Markdown）：
          - 每条格式：`文件:行` — 命中规则名（如 arch-feature-modules）— 问题 — 修复建议
          - 按影响从高到低排序，最多 8 条
          - 没有问题就只输出一行：后端未发现需要修改的问题
          - 不要输出思考过程，不要修改任何文件
          PROMPT

          bash .github/skill-review/scripts/review-with-retry.sh

      - name: Assemble comment body
        id: body
        # 只在一侧或两侧真的产出内容时才发评论，避免失败时空评论刷屏
        env:
          # 每次运行都新发一条评论，评论里带 commit/run 才能区分是哪一轮的评审
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # 短 SHA 用 printf 截断：set -u 下 ${HEAD_SHA:0:7} 遇到空值会直接报 unbound variable
          SHORT_SHA=$(printf '%.7s' "${HEAD_SHA:-}")
          # 某侧未改动时对应评审步骤会被跳过，文件不存在。先判存在再统计，
          # 否则 set -e + 输入重定向失败会终止本步骤，另一侧结果也发不出去。
          if [ -f .pr-skill-review/frontend.md ]; then
            FE=$(wc -c < .pr-skill-review/frontend.md)
          else
            FE=0
          fi
          if [ -f .pr-skill-review/backend.md ]; then
            BE=$(wc -c < .pr-skill-review/backend.md)
          else
            BE=0
          fi
          FE=$(echo "$FE" | tr -d ' ')
          BE=$(echo "$BE" | tr -d ' ')
          # 有补丁却拿不到有效输出 = 该侧评审失败/早停；与「这一侧本来就没改」区分开，
          # 后者是正常的 N/A。最终 commit status 据此置 failure，强制重新触发评审。
          FE_PATCH="${{ steps.diff.outputs.fe_bytes }}"
          BE_PATCH="${{ steps.diff.outputs.be_bytes }}"
          RESULT=ok
          if [ "$FE_PATCH" != "0" ] && [ "$FE" = "0" ]; then RESULT=invalid; fi
          if [ "$BE_PATCH" != "0" ] && [ "$BE" = "0" ]; then RESULT=invalid; fi
          echo "result=$RESULT" >> "$GITHUB_OUTPUT"
          if [ "$FE" = "0" ] && [ "$BE" = "0" ]; then
            echo "has_content=false" >> "$GITHUB_OUTPUT"
            echo "no review output produced; skipping comment (result=$RESULT)"
            exit 0
          fi
          {
            echo '<!-- pr-skill-review -->'
            echo '## 技能评审（Command Code · 完整技能按需加载）'
            echo
            if [ "$FE" != "0" ]; then
              echo '### 前端 · vercel-react-best-practices'
              echo
              cat .pr-skill-review/frontend.md
              echo
            fi
            if [ "$BE" != "0" ]; then
              echo '### 后端 · nestjs-best-practices'
              echo
              cat .pr-skill-review/backend.md
              echo
            fi
            echo '---'
            echo "<sub>由 Command Code CLI 按路径加载完整技能生成；通用评审见 PR-Agent 的 \`/review\`。评审 commit \`${SHORT_SHA}\` · [run #${RUN_ID}](https://github.com/${REPO}/actions/runs/${RUN_ID})</sub>"
          } > .pr-skill-review/comment.md
          echo "has_content=true" >> "$GITHUB_OUTPUT"
          echo "comment body bytes: $(wc -c < .pr-skill-review/comment.md)"

      - name: Publish review comment
        id: publish
        if: steps.body.outputs.has_content == 'true'
        # 每次运行都新发一条评论：编辑旧评论不会产生通知，评审结果容易被漏看。
        # marker 保留，仅用于标识本作业产出的评论（便于筛选/后续清理）。
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('.pr-skill-review/comment.md', 'utf8');
            const issue_number =
              context.payload.pull_request?.number ?? context.issue.number;
            const { owner, repo } = context.repo;
            const { data } = await github.rest.issues.createComment({
              owner,
              repo,
              issue_number,
              body,
            });
            core.info(`created comment ${data.id}`);

      - name: Publish review status
        # `always()`：评审步骤即使失败（continue-on-error）也要把 pending 收尾成 failure，
        # 否则必需检查会永远停在 pending，合并被无限期挡住。
        # N/A 快路径已由 status-start 置 success，这里跳过。
        if: always() && steps.status-start.outputs.skip != 'true'
        uses: actions/github-script@v9
        env:
          HEAD_SHA: ${{ steps.target.outputs.head_sha }}
          RESULT: ${{ steps.body.outputs.result }}
          PUBLISH: ${{ steps.publish.outcome }}
          RUN_ID: ${{ github.run_id }}
        with:
          script: |
            const { owner, repo } = context.repo;
            // result=ok 只说明评审产出了内容；评论没发出去时不能让检查变绿，
            // 否则「评审过了」但 PR 上看不到任何结论。
            const ok = process.env.RESULT === 'ok' && process.env.PUBLISH === 'success';
            const short = (process.env.HEAD_SHA || '').slice(0, 7);
            await github.rest.repos.createCommitStatus({
              owner,
              repo,
              sha: process.env.HEAD_SHA,
              context: 'skill-review',
              state: ok ? 'success' : 'failure',
              description: ok
                ? `已评审 ${short}`
                : '评审未产出有效结果，请重试',
              target_url: `https://github.com/${owner}/${repo}/actions/runs/${process.env.RUN_ID}`,
            });
            core.info(`skill-review status: ${ok ? 'success' : 'failure'} @ ${short}`);
